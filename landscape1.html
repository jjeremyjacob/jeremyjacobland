<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Landscape World</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =====================================================
   PAGE
===================================================== */

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
}

html {
    overflow-x: hidden;
    overflow-y: auto;
}

body {
    overflow-x: hidden;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
}


/* =====================================================
   SCROLL SPACE
===================================================== */

#scroll-space {
    height: 3450vh;
    width: 1px;
}


/* =====================================================
   CAMERA VIEWPORT
===================================================== */

#viewport {
    position: fixed;
    left: 0;
    top: 0;

    width: 100%;
    height: 100vh;
    height: var(--app-height, 100vh);

    overflow: hidden;

    background: #000;

    perspective: 1500px;
    perspective-origin: 50% 50%;

    -webkit-perspective: 1500px;
    -webkit-perspective-origin: 50% 50%;

    contain: layout paint;
}


/* =====================================================
   WORLD
===================================================== */

#world {
    position: absolute;

    left: 0;
    top: 0;

    width: 1920px;
    height: 1920px;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    will-change: transform;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


/* =====================================================
   LANDSCAPE PAIR

   Each depth layer is a 3840 × 1920 strip.

   LEFT IMAGE:
       0 → 1920

   RIGHT IMAGE:
       1920 → 3840

   The pair is transformed as one unit.
===================================================== */

.landscape-pair {
    position: absolute;

    width: 3840px;
    height: 1920px;

    left: 960px;
    top: 960px;

    margin-left: -1920px;
    margin-top: -960px;

    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;

    gap: 0;
    column-gap: 0;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;

    will-change: transform;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


/* =====================================================
   LANDSCAPE IMAGES
===================================================== */

.landscape-image {
    display: block;
    flex: 0 0 1920px;

    width: 1920px;
    height: 1920px;

    margin-left: -1px;
    padding: 0;
    border: 0;

    object-fit: fill;
    object-position: center center;

    image-rendering: auto;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
}


/* =====================================================
   ULTRA FOREGROUND
===================================================== */

.layer-ultra-near {
    transform:
        translateZ(250px)
        scale(1.00);

    z-index: 5;
}


/* =====================================================
   FOREGROUND
===================================================== */

.layer-foreground {
    transform:
        translateZ(0px)
        scale(1.00);

    z-index: 4;
}


/* =====================================================
   MIDDLE GROUND — NEAR
===================================================== */

.layer-middle-near {
    transform:
        translateX(225px)
        translateZ(-300px)
        scale(1.40);

    z-index: 3;
}


/* =====================================================
   MIDDLE GROUND — FAR
===================================================== */

.layer-middle-far {
    transform:
        translateX(75px)
        translateZ(-500px)
        scale(1.90);

    z-index: 2;
}


/* =====================================================
   FAR DISTANCE
===================================================== */

.layer-far {
    transform:
        translateZ(-750px)
        scale(1.36);

    z-index: 1;
}


/* =====================================================
   VIGNETTE
===================================================== */

#vignette {
    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 65%,
            rgba(0, 0, 0, 0.25) 100%
        );
}


/* =====================================================
   SCROLL LABEL
===================================================== */

#scroll-label {
    position: fixed;

    left: 50%;
    bottom: 30px;

    transform:
        translateX(-50%);

    z-index: 200;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 10px;

    letter-spacing: 0.3em;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.7);

    pointer-events: none;

    transition:
        opacity 0.8s ease;
}


/* =====================================================
   DEVELOPMENT XYZ GRID
===================================================== */

#debug-grid {
    position: absolute;

    left: 0;
    top: 0;

    width: 1920px;
    height: 1920px;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    pointer-events: none;

    z-index: 50;

    opacity: 0.72;
}


#debug-grid-xy,
#debug-grid-xz,
#debug-grid-yz {
    position: absolute;

    left: 960px;
    top: 960px;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.12) 1px,
            transparent 1px
        );

    background-size:
        50px 50px;
}


#debug-grid-xy {
    width: 1920px;
    height: 1920px;

    margin-left: -960px;
    margin-top: -960px;
}


#debug-grid-xz {
    width: 1920px;
    height: 600px;

    margin-left: -960px;
    margin-top: -300px;

    opacity: 0.55;

    transform:
        rotateX(90deg)
        translateZ(960px);
}


#debug-grid-yz {
    width: 1080px;
    height: 600px;

    margin-left: -540px;
    margin-top: -300px;

    opacity: 0.55;

    transform:
        rotateY(90deg)
        translateZ(960px);
}


/* =====================================================
   DEBUG ORIGIN
===================================================== */

#debug-origin {
    position: absolute;

    left: 960px;
    top: 960px;

    width: 1px;
    height: 1px;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
}


#debug-origin::before {
    content: "";

    position: absolute;

    width: 1920px;
    height: 2px;

    left: -960px;
    top: -1px;

    background:
        rgba(255,70,70,0.85);

    transform:
        translateZ(1px);
}


#debug-origin::after {
    content: "";

    position: absolute;

    width: 2px;
    height: 1920px;

    left: -1px;
    top: -960px;

    background:
        rgba(80,255,120,0.85);

    transform:
        translateZ(1px);
}


/* =====================================================
   AXIS LABELS
===================================================== */

.axis-label {
    position: absolute;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 12px;

    font-weight: bold;

    text-shadow:
        0 1px 4px rgba(0,0,0,0.9);
}


.axis-x {
    left: 970px;
    top: 945px;

    color:
        rgba(255,90,90,0.95);
}


.axis-y {
    left: 975px;
    top: 930px;

    color:
        rgba(90,255,130,0.95);
}


.axis-z {
    left: 985px;
    top: 960px;

    color:
        rgba(90,160,255,0.95);
}


/* =====================================================
   CAMERA MARKERS
===================================================== */

#camera-markers {
    position: absolute;

    inset: 0;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
}


.camera-marker {
    position: absolute;

    width: 14px;
    height: 14px;

    margin-left: -7px;
    margin-top: -7px;

    border:
        2px solid rgba(255,255,255,0.95);

    border-radius: 50%;

    background:
        rgba(0,0,0,0.65);

    box-shadow:

        0 0 0 3px
        rgba(255,255,255,0.08),

        0 0 10px
        rgba(255,255,255,0.25);

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
}


.camera-marker::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 4px;

    margin-left: -2px;
    margin-top: -2px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.95);
}


.camera-marker-label {
    position: absolute;

    left: 14px;
    top: -8px;

    min-width: 170px;

    padding: 5px 7px;

    font-family:
        "Courier New",
        monospace;

    font-size: 9px;

    line-height: 1.4;

    color:
        rgba(255,255,255,0.92);

    background:
        rgba(0,0,0,0.72);

    border:
        1px solid rgba(255,255,255,0.2);

    white-space: nowrap;

    text-shadow:
        0 1px 3px rgba(0,0,0,0.9);
}


.camera-marker-label strong {
    display: block;

    margin-bottom: 2px;

    font-size: 10px;

    color:
        rgba(255,255,255,1);
}


/* =====================================================
   GRID HIDDEN BY DEFAULT
===================================================== */

#debug-grid.is-hidden {
    display: none;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    html,
    body {
        width: 100%;

        overflow-x: hidden;

        overscroll-behavior-x: none;
    }


    body {
        touch-action: pan-y;

        -webkit-overflow-scrolling: touch;
    }


    #scroll-space {
        height: 3450vh;
    }


    #viewport {
        width: 100%;

        height: var(--app-height, 100vh);

        min-height: 0;

        perspective: 1200px;

        -webkit-perspective: 1200px;

        perspective-origin: 50% 50%;

        -webkit-perspective-origin: 50% 50%;
    }


    #world {
        width: 1920px;
        height: 1920px;

        will-change: transform;
    }


    /*
        The landscape strips remain 3840px wide.
    */

    .landscape-pair {
        width: 3840px;
        height: 1920px;
    }


    #debug-grid {
        display: none !important;
    }


    #scroll-label {
        bottom: 20px;

        font-size: 9px;
    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media (max-width: 400px) {

    #scroll-label {
        font-size: 8px;

        letter-spacing: 0.2em;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    #scroll-label {
        transition: none;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     SCROLL SPACE
===================================================== -->

<div id="scroll-space"></div>


<!-- =====================================================
     CAMERA VIEWPORT
===================================================== -->

<div id="viewport">


    <!-- =================================================
         WORLD
    ================================================= -->

    <div id="world">


        <!-- =============================================
             FAR DISTANCE
             3840 × 1920
             landscape4-left
             landscape4-right
        ============================================== -->

        <div class="landscape-pair layer-far">

            <img
                class="landscape-image"
                src="landscapeimages/landscape4-left.webp"
                alt=""
                draggable="false"
            >

            <img
                class="landscape-image"
                src="landscapeimages/landscape4-right.webp"
                alt=""
                draggable="false"
            >

        </div>


        <!-- =============================================
             MIDDLE GROUND — FAR
             3840 × 1920
             landscape3-left
             landscape3-right
        ============================================== -->

        <div class="landscape-pair layer-middle-far">

            <img
                class="landscape-image"
                src="landscapeimages/landscape3-left.webp"
                alt=""
                draggable="false"
            >

            <img
                class="landscape-image"
                src="landscapeimages/landscape3-right.webp"
                alt=""
                draggable="false"
            >

        </div>


        <!-- =============================================
             MIDDLE GROUND — NEAR
             3840 × 1920
             landscape2-left
             landscape2-right
        ============================================== -->

        <div class="landscape-pair layer-middle-near">

            <img
                class="landscape-image"
                src="landscapeimages/landscape2-left.webp"
                alt=""
                draggable="false"
            >

            <img
                class="landscape-image"
                src="landscapeimages/landscape2-right.webp"
                alt=""
                draggable="false"
            >

        </div>


        <!-- =============================================
             FOREGROUND
             3840 × 1920
             landscape1-left
             landscape1-right
        ============================================== -->

        <div class="landscape-pair layer-foreground">

            <img
                class="landscape-image"
                src="landscapeimages/landscape1-left.webp"
                alt=""
                draggable="false"
            >

            <img
                class="landscape-image"
                src="landscapeimages/landscape1-right.webp"
                alt=""
                draggable="false"
            >

        </div>


        <!-- =============================================
             ULTRA FOREGROUND
             3840 × 1920
             landscape5-left
             landscape5-right
        ============================================== -->

        <div class="landscape-pair layer-ultra-near">

            <img
                class="landscape-image"
                src="landscapeimages/landscape5-left.webp"
                alt=""
                draggable="false"
            >

            <img
                class="landscape-image"
                src="landscapeimages/landscape5-right.webp"
                alt=""
                draggable="false"
            >

        </div>


        <!-- =============================================
             DEVELOPMENT XYZ GRID
        ============================================== -->

        <div
            id="debug-grid"
            class="is-hidden"
            aria-hidden="true"
        >

            <div id="debug-grid-xy"></div>

            <div id="debug-grid-xz"></div>

            <div id="debug-grid-yz"></div>

            <div id="debug-origin">

                <span class="axis-label axis-x">
                    X
                </span>

                <span class="axis-label axis-y">
                    Y
                </span>

                <span class="axis-label axis-z">
                    Z
                </span>

            </div>

            <div id="camera-markers"></div>

        </div>


    </div>

</div>


<!-- =====================================================
     VIGNETTE
===================================================== -->

<div id="vignette"></div>


<!-- =====================================================
     SCROLL LABEL
===================================================== -->

<div id="scroll-label">
    Scroll to travel
</div>


<script>

/* =====================================================
   IMMERSIVE LANDSCAPE CAMERA
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const world =
            document.getElementById(
                "world"
            );


        const scrollLabel =
            document.getElementById(
                "scroll-label"
            );


        if (!world) {
            return;
        }


        /* =================================================
           WORLD SYSTEM
        ================================================= */

        const OLD_WORLD_SIZE = 7680;

        const WORLD_SIZE = 1920;

        const WORLD_SCALE =
            WORLD_SIZE /
            OLD_WORLD_SIZE;


        const WORLD_WIDTH =
            WORLD_SIZE;


        const WORLD_HEIGHT =
            WORLD_SIZE;


        const BASE_PERSPECTIVE = 6000;


        const SCALED_PERSPECTIVE =
            BASE_PERSPECTIVE *
            WORLD_SCALE;


        /* =================================================
           SAFARI VIEWPORT HEIGHT
        ================================================= */

        function updateViewportHeight() {

            const height =
                window.innerHeight;


            document.documentElement
                .style
                .setProperty(
                    "--app-height",
                    `${height}px`
                );

        }


        updateViewportHeight();


        /* =================================================
           DESKTOP CAMERA PATH
        ================================================= */

        const desktopCameraPath = [

            {
                scroll: 0.01,

                x: 3840,
                y: 3000,
                z: 2800,

                rotateX: 10,
                rotateY: 0
            },

            {
                scroll: 0.10,

                x: 2240,
                y: 6060,
                z: -2000,

                rotateX: 0,
                rotateY: 2
            },

            {
                scroll: 0.25,

                x: 6400,
                y: 6000,
                z: -3900,

                rotateX: 0,
                rotateY: -2
            },

            {
                scroll: 0.40,

                x: 7660,
                y: 4460,
                z: -5000,

                rotateX: 6,
                rotateY: -2
            },

            {
                scroll: 0.55,

                x: 3750,
                y: 3050,
                z: -4500,

                rotateX: -10,
                rotateY: -2
            },

            {
                scroll: 0.70,

                x: 4550,
                y: 2500,
                z: -5000,

                rotateX: 5,
                rotateY: 0
            },

            {
                scroll: 1.00,

                x: 4200,
                y: 3800,
                z: 6000,

                rotateX: 0,
                rotateY: 3
            }

        ];


        /* =================================================
           TABLET CAMERA PATH
        ================================================= */

        const tabletCameraPath = [

            {
                scroll: 0.01,

                x: 3840,
                y: 4100,
                z: 7000,

                rotateX: 10,
                rotateY: 0
            },

            {
                scroll: 0.10,

                x: 1350,
                y: 5850,
                z: 1000,

                rotateX: 8,
                rotateY: 1
            },

            {
                scroll: 0.25,

                x: 6500,
                y: 5900,
                z: 0,

                rotateX: 6,
                rotateY: -2
            },

            {
                scroll: 0.40,

                x: 8000,
                y: 4450,
                z: -3000,

                rotateX: 6,
                rotateY: -2
            },

            {
                scroll: 0.55,

                x: 3400,
                y: 3850,
                z: -3000,

                rotateX: 21,
                rotateY: -2
            },

            {
                scroll: 0.70,

                x: 4500,
                y: 1800,
                z: -1200,

                rotateX: -25,
                rotateY: 0
            },

            {
                scroll: 1,

                x: 3540,
                y: 4100,
                z: 6100,

                rotateX: 20,
                rotateY: -15
            }

        ];


        /* =================================================
           MOBILE CAMERA PATH
        ================================================= */

        const mobileCameraPath = [

            {
                scroll: 0.01,

                x: 3840,
                y: 4100,
                z: 7000,

                rotateX: 10,
                rotateY: 0
            },

            {
                scroll: 0.10,

                x: 1350,
                y: 5850,
                z: 1000,

                rotateX: 8,
                rotateY: 1
            },

            {
                scroll: 0.25,

                x: 6500,
                y: 5900,
                z: 0,

                rotateX: 6,
                rotateY: -2
            },

            {
                scroll: 0.40,

                x: 8000,
                y: 4450,
                z: -3000,

                rotateX: 6,
                rotateY: -2
            },

            {
                scroll: 0.55,

                x: 3400,
                y: 3850,
                z: -3000,

                rotateX: 21,
                rotateY: -2
            },

            {
                scroll: 0.70,

                x: 4500,
                y: 3800,
                z: -1200,

                rotateX: 25,
                rotateY: 0
            },

            {
                scroll: 1,

                x: 3540,
                y: 4200,
                z: 6100,

                rotateX: 0,
                rotateY: 0
            }

        ];


        /* =================================================
           SCALE CAMERA PATH
        ================================================= */

        function scaleCameraPath(path) {

            return path.map(
                point => ({

                    scroll:
                        point.scroll,

                    x:
                        point.x *
                        WORLD_SCALE,

                    y:
                        point.y *
                        WORLD_SCALE,

                    z:
                        point.z *
                        WORLD_SCALE,

                    rotateX:
                        point.rotateX,

                    rotateY:
                        point.rotateY

                })
            );

        }


        const scaledDesktopCameraPath =
            scaleCameraPath(
                desktopCameraPath
            );


        const scaledTabletCameraPath =
            scaleCameraPath(
                tabletCameraPath
            );


        const scaledMobileCameraPath =
            scaleCameraPath(
                mobileCameraPath
            );


        /* =================================================
           CHOOSE CAMERA PATH
        ================================================= */

        function getCameraPath() {

            const width =
                window.innerWidth;


            if (width <= 700) {
                return scaledMobileCameraPath;
            }


            if (width <= 1024) {
                return scaledTabletCameraPath;
            }


            return scaledDesktopCameraPath;

        }


        let cameraPath =
            getCameraPath();


        /* =================================================
           CAMERA STATE
        ================================================= */

        let current = {

            x:
                WORLD_WIDTH / 2,

            y:
                WORLD_HEIGHT / 2,

            z:
                4000 *
                WORLD_SCALE,

            rotateX:
                8,

            rotateY:
                0

        };


        let target = {

            x:
                WORLD_WIDTH / 2,

            y:
                WORLD_HEIGHT / 2,

            z:
                4000 *
                WORLD_SCALE,

            rotateX:
                8,

            rotateY:
                0

        };


        /* =================================================
           DEVELOPMENT GRID
        ================================================= */

        const debugGrid =
            document.getElementById(
                "debug-grid"
            );


        const cameraMarkers =
            document.getElementById(
                "camera-markers"
            );


        /* =================================================
           CREATE CAMERA MARKERS
        ================================================= */

        function createCameraMarkers() {

            if (!cameraMarkers) {
                return;
            }


            cameraMarkers.innerHTML = "";


            if (
                window.innerWidth <= 700
            ) {
                return;
            }


            cameraPath.forEach(
                (point, index) => {

                    const marker =
                        document.createElement(
                            "div"
                        );


                    marker.className =
                        "camera-marker";


                    marker.style.left =
                        `${point.x}px`;


                    marker.style.top =
                        `${point.y}px`;


                    marker.style.transform =
                        `translateZ(${-point.z}px)`;


                    const label =
                        document.createElement(
                            "div"
                        );


                    label.className =
                        "camera-marker-label";


                    const originalX =
                        Math.round(
                            point.x /
                            WORLD_SCALE
                        );


                    const originalY =
                        Math.round(
                            point.y /
                            WORLD_SCALE
                        );


                    const originalZ =
                        Math.round(
                            point.z /
                            WORLD_SCALE
                        );


                    label.innerHTML =

                        `<strong>
                            NODE ${String(index + 1).padStart(2, "0")}
                            — ${Math.round(point.scroll * 100)}%
                        </strong>

                        X ${originalX}
                        &nbsp;&nbsp;
                        Y ${originalY}
                        &nbsp;&nbsp;
                        Z ${originalZ}

                        <br>

                        ROT X ${point.rotateX}°
                        &nbsp;&nbsp;
                        ROT Y ${point.rotateY}°`;


                    marker.appendChild(
                        label
                    );


                    cameraMarkers.appendChild(
                        marker
                    );

                }
            );

        }


        createCameraMarkers();


        /* =================================================
           GRID KEYBOARD TOGGLE

           G = GRID ON / OFF
        ================================================= */

        if (debugGrid) {

            document.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key.toLowerCase() ===
                        "g"
                    ) {

                        if (
                            window.innerWidth <= 700
                        ) {
                            return;
                        }


                        debugGrid.classList.toggle(
                            "is-hidden"
                        );

                    }

                }
            );

        }


        /* =================================================
           LINEAR INTERPOLATION
        ================================================= */

        function lerp(
            a,
            b,
            amount
        ) {

            return (
                a +
                (b - a) *
                amount
            );

        }


        /* =================================================
           WIDE BEZIER EASE
        ================================================= */

        function bezierEase(
            t
        ) {

            const p0 = 0.0;

            const p1 = 0.0;

            const p2 = 0.98;

            const p3 = 1.0;

            const oneMinusT =
                1 - t;


            return (

                oneMinusT *
                oneMinusT *
                oneMinusT *
                p0

                +

                3 *
                oneMinusT *
                oneMinusT *
                t *
                p1

                +

                3 *
                oneMinusT *
                t *
                t *
                p2

                +

                t *
                t *
                t *
                p3

            );

        }


        /* =================================================
           FIND CAMERA POSITION
        ================================================= */

        function getCameraPosition(
            progress
        ) {

            if (
                progress <=
                cameraPath[0].scroll
            ) {

                return {
                    ...cameraPath[0]
                };

            }


            if (
                progress >=
                cameraPath[
                    cameraPath.length - 1
                ].scroll
            ) {

                return {
                    ...cameraPath[
                        cameraPath.length - 1
                    ]
                };

            }


            for (
                let i = 0;
                i <
                cameraPath.length - 1;
                i++
            ) {

                const a =
                    cameraPath[i];


                const b =
                    cameraPath[
                        i + 1
                    ];


                if (
                    progress >= a.scroll &&
                    progress <= b.scroll
                ) {

                    const range =
                        b.scroll -
                        a.scroll;


                    const localProgress =

                        (
                            progress -
                            a.scroll
                        ) /

                        range;


                    const eased =
                        bezierEase(
                            localProgress
                        );


                    return {

                        x:
                            lerp(
                                a.x,
                                b.x,
                                eased
                            ),

                        y:
                            lerp(
                                a.y,
                                b.y,
                                eased
                            ),

                        z:
                            lerp(
                                a.z,
                                b.z,
                                eased
                            ),

                        rotateX:
                            lerp(
                                a.rotateX,
                                b.rotateX,
                                eased
                            ),

                        rotateY:
                            lerp(
                                a.rotateY,
                                b.rotateY,
                                eased
                            )

                    };

                }

            }

        }


        /* =================================================
           UPDATE TARGET
        ================================================= */

        function updateTarget() {

            updateViewportHeight();


            const newCameraPath =
                getCameraPath();


            if (
                newCameraPath !==
                cameraPath
            ) {

                cameraPath =
                    newCameraPath;


                createCameraMarkers();

            }


            const maxScroll =

                document.documentElement
                    .scrollHeight -

                window.innerHeight;


            if (
                maxScroll <= 0
            ) {
                return;
            }


            const progress =

                window.scrollY /
                maxScroll;


            target =
                getCameraPosition(
                    progress
                );


            if (scrollLabel) {

                scrollLabel.style.opacity =

                    progress > 0.03
                        ? "0"
                        : "1";

            }

        }


        /* =================================================
           RENDER
        ================================================= */

        function render() {

            const smoothing =

                window.innerWidth <= 700

                    ? 0.11

                    : 0.075;


            current.x =
                lerp(
                    current.x,
                    target.x,
                    smoothing
                );


            current.y =
                lerp(
                    current.y,
                    target.y,
                    smoothing
                );


            current.z =
                lerp(
                    current.z,
                    target.z,
                    smoothing
                );


            current.rotateX =
                lerp(
                    current.rotateX,
                    target.rotateX,
                    smoothing
                );


            current.rotateY =
                lerp(
                    current.rotateY,
                    target.rotateY,
                    smoothing
                );


            const translateX =

                (
                    window.innerWidth / 2
                ) -

                current.x;


            const translateY =

                (
                    window.innerHeight / 2
                ) -

                current.y;


            world.style.transform =

                `translate3d(
                    ${translateX}px,
                    ${translateY}px,
                    ${-current.z}px
                )
                rotateX(
                    ${current.rotateX}deg
                )
                rotateY(
                    ${current.rotateY}deg
                )`;


            requestAnimationFrame(
                render
            );

        }


        /* =================================================
           EVENTS
        ================================================= */

        window.addEventListener(
            "scroll",
            updateTarget,
            {
                passive: true
            }
        );


        window.addEventListener(
            "resize",
            updateTarget,
            {
                passive: true
            }
        );


        window.addEventListener(
            "orientationchange",
            () => {

                setTimeout(
                    updateTarget,
                    150
                );

            },
            {
                passive: true
            }
        );


        /* =================================================
           START
        ================================================= */

        updateTarget();

        render();

    }

);

</script>

</body>

</html>
