<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"

>

<title>Landscape World</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =====================================================
   PAGE
===================================================== */

html,
body {

    width: 100%;
    min-height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

}

html {
    overflow-x: hidden;
}

body {
    overflow-x: hidden;
}


/* =====================================================
   SCROLL SPACE
===================================================== */

#scroll-space {

    height: 5450vh;

}


/* =====================================================
   CAMERA VIEWPORT
===================================================== */

#viewport {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

    perspective: 1500px;
    perspective-origin: 50% 50%;

    -webkit-perspective: 1500px;
    -webkit-perspective-origin: 50% 50%;

}


/* =====================================================
   WORLD
===================================================== */

#world {

    position: absolute;

    left: 0;
    top: 0;

    width: 1920px;
    height: 1920px;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    will-change: transform;

}


/* =====================================================
   LANDSCAPE LAYERS
===================================================== */

.landscape-layer {

    position: absolute;

    width: 1920px;
    height: 1920px;

    left: 960px;
    top: 960px;

    margin-left: -960px;
    margin-top: -960px;

    object-fit: fill;

    object-position: center center;

    transform-origin: center center;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;

}


/* =====================================================
   ULTRA FOREGROUND — VERY CLOSE
===================================================== */

.layer-ultra-near {

    transform:
        translateZ(250px)
        scale(1.00);

    z-index: 5;

}


/* =====================================================
   FOREGROUND
===================================================== */

.layer-foreground {

    transform:
        translateZ(0px)
        scale(1.00);

    z-index: 4;

}


/* =====================================================
   MIDDLE GROUND — NEAR
===================================================== */

.layer-middle-near {

    transform:
        translateX(225px)
        translateZ(-300px)
        scale(1.40);

    z-index: 3;

}


/* =====================================================
   MIDDLE GROUND — FAR
===================================================== */

.layer-middle-far {

    transform:
        translateX(75px)
        translateZ(-500px)
        scale(1.90);

    z-index: 2;

}


/* =====================================================
   FAR DISTANCE
===================================================== */

.layer-far {

    transform:
        translateZ(-750px)
        scale(1.36);

    z-index: 1;

}


/* =====================================================
   VIGNETTE
===================================================== */

#vignette {

    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 65%,
            rgba(0, 0, 0, 0.25) 100%
        );

}


/* =====================================================
   SCROLL LABEL
===================================================== */

#scroll-label {

    position: fixed;

    left: 50%;
    bottom: 30px;

    transform:
        translateX(-50%);

    z-index: 200;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 10px;

    letter-spacing: 0.3em;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.7);

    pointer-events: none;

    transition:
        opacity 0.8s ease;

}


/* =====================================================
   DEVELOPMENT XYZ GRID
   WORLD = 1920 × 1920
===================================================== */

#debug-grid {

    position: absolute;

    left: 0;
    top: 0;

    width: 1920px;
    height: 1920px;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    pointer-events: none;

    z-index: 50;

    opacity: 0.72;

}


#debug-grid-xy,
#debug-grid-xz,
#debug-grid-yz {

    position: absolute;

    left: 960px;
    top: 960px;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.12) 1px,
            transparent 1px
        );

    background-size: 50px 50px;

}


/* =====================================================
   XY PLANE
===================================================== */

#debug-grid-xy {

    width: 1920px;
    height: 1920px;

    margin-left: -960px;
    margin-top: -960px;

}


/* =====================================================
   XZ PLANE
===================================================== */

#debug-grid-xz {

    width: 1920px;
    height: 600px;

    margin-left: -960px;
    margin-top: -300px;

    opacity: 0.55;

    transform:
        rotateX(90deg)
        translateZ(960px);

}


/* =====================================================
   YZ PLANE
===================================================== */

#debug-grid-yz {

    width: 600px;
    height: 600px;

    margin-left: -300px;
    margin-top: -300px;

    opacity: 0.55;

    transform:
        rotateY(90deg)
        translateZ(960px);

}


/* =====================================================
   DEBUG ORIGIN
===================================================== */

#debug-origin {

    position: absolute;

    left: 960px;
    top: 960px;

    width: 1px;
    height: 1px;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

}


#debug-origin::before {

    content: "";

    position: absolute;

    width: 1920px;
    height: 2px;

    left: -960px;
    top: -1px;

    background:
        rgba(255,70,70,0.85);

    transform:
        translateZ(2px);

}


#debug-origin::after {

    content: "";

    position: absolute;

    width: 2px;
    height: 1920px;

    left: -1px;
    top: -960px;

    background:
        rgba(80,255,120,0.85);

    transform:
        translateZ(2px);

}


/* =====================================================
   AXIS LABELS
===================================================== */

.axis-label {

    position: absolute;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 12px;

    font-weight: bold;

    text-shadow:
        0 1px 4px rgba(0,0,0,0.9);

}


.axis-x {

    left: 970px;
    top: 940px;

    color:
        rgba(255,90,90,0.95);

}


.axis-y {

    left: 980px;
    top: 920px;

    color:
        rgba(90,255,130,0.95);

}


.axis-z {

    left: 990px;
    top: 960px;

    color:
        rgba(90,160,255,0.95);

}


/* =====================================================
   CAMERA MARKERS
===================================================== */

#camera-markers {

    position: absolute;

    inset: 0;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

}


.camera-marker {

    position: absolute;

    width: 12px;
    height: 12px;

    margin-left: -6px;
    margin-top: -6px;

    border:
        2px solid rgba(255,255,255,0.95);

    border-radius: 50%;

    background:
        rgba(0,0,0,0.65);

    box-shadow:

        0 0 0 3px
        rgba(255,255,255,0.08),

        0 0 10px
        rgba(255,255,255,0.25);

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

}


.camera-marker::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 4px;

    margin-left: -2px;
    margin-top: -2px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.95);

}


.camera-marker-label {

    position: absolute;

    left: 12px;
    top: -8px;

    min-width: 150px;

    padding: 5px 7px;

    font-family:
        "Courier New",
        monospace;

    font-size: 9px;

    line-height: 1.4;

    color:
        rgba(255,255,255,0.92);

    background:
        rgba(0,0,0,0.72);

    border:
        1px solid rgba(255,255,255,0.2);

    white-space: nowrap;

    text-shadow:
        0 1px 3px rgba(0,0,0,0.9);

}


.camera-marker-label strong {

    display: block;

    margin-bottom: 2px;

    font-size: 10px;

    color:
        rgba(255,255,255,1);

}


/* =====================================================
   GRID HIDDEN BY DEFAULT
===================================================== */

#debug-grid.is-hidden {

    display: none;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    html,
    body {

        width: 100%;

        overflow-x: hidden;

        overscroll-behavior-x: none;

    }


    body {

        touch-action: pan-y;

        -webkit-overflow-scrolling: touch;

    }


    #viewport {

        width: 100%;

        height: 100dvh;

        min-height: 100vh;

        perspective: 1500px;

        -webkit-perspective: 1500px;

        perspective-origin: 50% 50%;

        -webkit-perspective-origin: 50% 50%;

    }


    #world {

        will-change: transform;

    }


    #scroll-label {

        bottom: 20px;

        font-size: 9px;

    }

}


/* =====================================================
   VERY SMALL MOBILE DEVICES
===================================================== */

@media (max-width: 400px) {

    #scroll-label {

        font-size: 8px;

        letter-spacing: 0.2em;

    }

}

</style>

</head>

<body>

<!-- =====================================================
     SCROLL SPACE
===================================================== -->

<div id="scroll-space"></div>

<!-- =====================================================
     CAMERA VIEWPORT
===================================================== -->

<div id="viewport">

<!-- =====================================================
     WORLD
===================================================== -->

<div id="world">

<!-- =============================================
     FAR DISTANCE
============================================== -->

<img
class="landscape-layer layer-far"
src="landscapeimages/landscape4.webp"
alt=""
draggable="false"

>

<!-- =============================================

============================================== -->

<img
class="landscape-layer layer-middle-far"
src="landscapeimages/landscape3.webp"
alt=""
draggable="false"

>

<!-- =============================================
     MIDDLE GROUND — NEAR
============================================== -->

<img
class="landscape-layer layer-middle-near"
src="landscapeimages/landscape2.webp"
alt=""
draggable="false"

>

<!-- =============================================
     FOREGROUND
============================================== -->

<img
class="landscape-layer layer-foreground"
src="landscapeimages/landscape1.webp"
alt=""
draggable="false"

>

<!-- =============================================
     ULTRA FOREGROUND — VERY CLOSE
============================================== -->

<img
class="landscape-layer layer-ultra-near"
src="landscapeimages/landscape5.webp"
alt=""
draggable="false"

>

<!-- =============================================
     DEVELOPMENT XYZ GRID
============================================== -->

<div
    id="debug-grid"
    class="is-hidden"
    aria-hidden="true"
>

```
<div id="debug-grid-xy"></div>

<div id="debug-grid-xz"></div>

<div id="debug-grid-yz"></div>

<div id="debug-origin">

    <span class="axis-label axis-x">
        X
    </span>

    <span class="axis-label axis-y">
        Y
    </span>

    <span class="axis-label axis-z">
        Z
    </span>

</div>

<div id="camera-markers"></div>
```

</div>

</div>

</div>

<!-- =====================================================
     VIGNETTE
===================================================== -->

<div id="vignette"></div>

<!-- =====================================================
     SCROLL LABEL
===================================================== -->

<div id="scroll-label">
    Scroll to travel
</div>

<script>

/* =====================================================
   IMMERSIVE LANDSCAPE CAMERA
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const world =
            document.getElementById(
                "world"
            );


        const scrollLabel =
            document.getElementById(
                "scroll-label"
            );


        if (!world) {
            return;
        }


        /* =================================================
           WORLD DIMENSIONS

           IMPORTANT:
           EVERYTHING NOW USES THE 1920 SYSTEM.
        ================================================= */

        const WORLD_WIDTH = 1920;

        const WORLD_HEIGHT = 1920;

        const WORLD_CENTER_X =
            WORLD_WIDTH / 2;

        const WORLD_CENTER_Y =
            WORLD_HEIGHT / 2;


        /* =================================================
           CAMERA STATE
        ================================================= */

        let current = {

            x: WORLD_CENTER_X,

            y: WORLD_CENTER_Y,

            z: 1000,

            rotateX: 8,

            rotateY: 0

        };


        let target = {

            x: WORLD_CENTER_X,

            y: WORLD_CENTER_Y,

            z: 1000,

            rotateX: 8,

            rotateY: 0

        };


        /* =================================================
           CAMERA PATH

           Converted from the previous 7680 system
           to the new 1920 system.

           SCALE FACTOR = 0.25
        ================================================= */

        const cameraPath = [

            /* =============================================
               1%
               OPENING
            ============================================== */

            {
                scroll: 0.01,

                x: 960,

                y: 750,

                z: 5200,

                rotateX: 20,

                rotateY: 5
            },


            /* =============================================
               10%
               LOCATION 02
            ============================================== */

            {
                scroll: 0.10,

                x: 510,

                y: 1515,

                z: 3000,

                rotateX: 8,

                rotateY: 2
            },


            /* =============================================
               25%
               LOCATION 03
            ============================================== */

            {
                scroll: 0.25,

                x: 1600,

                y: 1500,

                z: 875,

                rotateX: 6,

                rotateY: -2
            },


            /* =============================================
               40%
               LOCATION 04
            ============================================== */

            {
                scroll: 0.40,

                x: 2040,

                y: 1115,

                z: -250,

                rotateX: 6,

                rotateY: -2
            },


            /* =============================================
               55%
               LOCATION 05
            ============================================== */

            {
                scroll: 0.55,

                x: 937.5,

                y: 1012.5,

                z: -375,

                rotateX: 23,

                rotateY: -2
            },


            /* =============================================
               70%
               LOCATION 06
            ============================================== */

            {
                scroll: 0.70,

                x: 1137.5,

                y: 725,

                z: -250,

                rotateX: 21,

                rotateY: 0
            },


            /* =============================================
               100%
               LOCATION 07
            ============================================== */

            {
                scroll: 1.00,

                x: 1010,

                y: 1200,

                z: 6250,

                rotateX: 25,

                rotateY: 0
            }

        ];


        /* =================================================
           DEVELOPMENT XYZ GRID
        ================================================= */

        const debugGrid =
            document.getElementById(
                "debug-grid"
            );


        const cameraMarkers =
            document.getElementById(
                "camera-markers"
            );


        /* =================================================
           CAMERA MARKERS

           Markers use exactly the same
           coordinate system as cameraPath.
        ================================================= */

        if (cameraMarkers) {

            cameraPath.forEach(
                (point, index) => {

                    const marker =
                        document.createElement(
                            "div"
                        );


                    marker.className =
                        "camera-marker";


                    marker.style.left =
                        `${point.x}px`;


                    marker.style.top =
                        `${point.y}px`;


                    marker.style.transform =
                        `translateZ(${-point.z}px)`;


                    const label =
                        document.createElement(
                            "div"
                        );


                    label.className =
                        "camera-marker-label";


                    label.innerHTML =

                        `<strong>
                            NODE ${String(index + 1).padStart(2, "0")}
                            — ${Math.round(point.scroll * 100)}%
                        </strong>

                        X ${Math.round(point.x)}
                        &nbsp;&nbsp;
                        Y ${Math.round(point.y)}
                        &nbsp;&nbsp;
                        Z ${Math.round(point.z)}

                        <br>

                        ROT X ${point.rotateX}°
                        &nbsp;&nbsp;
                        ROT Y ${point.rotateY}°`;


                    marker.appendChild(
                        label
                    );


                    cameraMarkers.appendChild(
                        marker
                    );

                }
            );

        }


        /* =================================================
           DEVELOPMENT GRID — KEYBOARD TOGGLE

           G = GRID ON / OFF
        ================================================= */

        if (debugGrid) {

            document.addEventListener(
                "keydown",
                (event) => {

                    if (
                        event.key.toLowerCase() ===
                        "g"
                    ) {

                        debugGrid.classList.toggle(
                            "is-hidden"
                        );

                    }

                }
            );

        }


        /* =================================================
           LINEAR INTERPOLATION
        ================================================= */

        function lerp(
            a,
            b,
            amount
        ) {

            return (

                a +

                (
                    b - a
                ) *

                amount

            );

        }


        /* =================================================
           WIDE BEZIER EASE
        ================================================= */

        function bezierEase(
            t
        ) {

            const p0 = 0.0;

            const p1 = 0.0;

            const p2 = 0.98;

            const p3 = 1.0;

            const oneMinusT =
                1 - t;


            return (

                oneMinusT *
                oneMinusT *
                oneMinusT *
                p0

                +

                3 *
                oneMinusT *
                oneMinusT *
                t *
                p1

                +

                3 *
                oneMinusT *
                t *
                t *
                p2

                +

                t *
                t *
                t *
                p3

            );

        }


        /* =================================================
           FIND CAMERA POSITION
        ================================================= */

        function getCameraPosition(
            progress
        ) {

            if (
                progress <=
                cameraPath[0].scroll
            ) {

                return {
                    ...cameraPath[0]
                };

            }


            if (
                progress >=
                cameraPath[
                    cameraPath.length - 1
                ].scroll
            ) {

                return {
                    ...cameraPath[
                        cameraPath.length - 1
                    ]
                };

            }


            for (
                let i = 0;
                i <
                cameraPath.length - 1;
                i++
            ) {

                const a =
                    cameraPath[i];


                const b =
                    cameraPath[
                        i + 1
                    ];


                if (
                    progress >= a.scroll &&
                    progress <= b.scroll
                ) {

                    const range =
                        b.scroll -
                        a.scroll;


                    const localProgress =

                        (
                            progress -
                            a.scroll
                        ) /

                        range;


                    const eased =
                        bezierEase(
                            localProgress
                        );


                    return {

                        x:
                            lerp(
                                a.x,
                                b.x,
                                eased
                            ),

                        y:
                            lerp(
                                a.y,
                                b.y,
                                eased
                            ),

                        z:
                            lerp(
                                a.z,
                                b.z,
                                eased
                            ),

                        rotateX:
                            lerp(
                                a.rotateX,
                                b.rotateX,
                                eased
                            ),

                        rotateY:
                            lerp(
                                a.rotateY,
                                b.rotateY,
                                eased
                            )

                    };

                }

            }

        }


        /* =================================================
           UPDATE TARGET
        ================================================= */

        function updateTarget() {

            const maxScroll =

                document.documentElement
                    .scrollHeight -

                window.innerHeight;


            if (
                maxScroll <= 0
            ) {

                return;

            }


            const progress =

                window.scrollY /
                maxScroll;


            target =
                getCameraPosition(
                    progress
                );


            if (
                scrollLabel
            ) {

                scrollLabel.style.opacity =

                    progress > 0.03

                        ? "0"

                        : "1";

            }

        }


        /* =================================================
           RENDER
        ================================================= */

        function render() {

            current.x =
                lerp(
                    current.x,
                    target.x,
                    0.075
                );


            current.y =
                lerp(
                    current.y,
                    target.y,
                    0.075
                );


            current.z =
                lerp(
                    current.z,
                    target.z,
                    0.075
                );


            current.rotateX =
                lerp(
                    current.rotateX,
                    target.rotateX,
                    0.075
                );


            current.rotateY =
                lerp(
                    current.rotateY,
                    target.rotateY,
                    0.075
                );


            /* =================================================
               WORLD TRANSFORM
            ================================================= */

            world.style.transform =

                `translate3d(

                    calc(
                        ${window.innerWidth / 2}px -
                        ${current.x}px
                    ),

                    calc(
                        ${window.innerHeight / 2}px -
                        ${current.y}px
                    ),

                    ${-current.z}px

                )

                rotateX(
                    ${current.rotateX}deg
                )

                rotateY(
                    ${current.rotateY}deg
                )`;


            requestAnimationFrame(
                render
            );

        }


        /* =================================================
           EVENTS
        ================================================= */

        window.addEventListener(
            "scroll",
            updateTarget,
            {
                passive: true
            }
        );


        window.addEventListener(
            "resize",
            updateTarget,
            {
                passive: true
            }
        );


        /* =================================================
           START
        ================================================= */

        updateTarget();

        render();

    }

);

</script>

</body>

</html>
